services:
  zomboid-webui:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: zomboid-webui
    restart: unless-stopped
    environment:
      # Name of your existing Project Zomboid server container. Used as the RCON
      # host guess always, and (if DOCKER_CONTROL_ENABLED below) as the target of
      # Docker start/stop/restart/stats too.
      ZOMBOID_CONTAINER: zomboid-b42
      ZOMBOID_DATA: /data/zomboid
      WORKSHOP_DATA: /data/workshop
      DB_PATH: /app/data/webui.db
      TZ: UTC
      # If your Zomboid server also runs in a Docker container:
      # Set to "true" AND uncomment the docker.sock mount below to enable the
      # Start/Stop/Restart buttons and live game-process CPU/RAM stats. This
      # grants the container host-root-equivalent access via the Docker socket -
      # only enable it if you're comfortable with that trade for the convenience.
      DOCKER_CONTROL_ENABLED: "false"
      # Set to "true" (and set WEBUI_USERNAME/WEBUI_PASSWORD to your own values
      # below) to require a login before the app can be used - recommended if
      # this is ever reachable outside your LAN. Leave WEBUI_PASSWORD blank and
      # SECURE_MODE stays off; setting SECURE_MODE=true with a blank password
      # refuses to start rather than run "secure" with no real password.
      SECURE_MODE: "false"
      WEBUI_USERNAME: admin
      WEBUI_PASSWORD: ""
    volumes:
      # Point these at your actual Zomboid data / Workshop mod directories on the host.
      - /path/to/your/zomboid/data:/data/zomboid
      - /path/to/your/zomboid/workshop:/data/workshop
      - ./webui-data:/app/data
      # Only needed if DOCKER_CONTROL_ENABLED is "true" above - leave commented
      # out (and that set to "false") for a fully unprivileged container.
      # - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # host_port:container_port - change the left side to use a different host port.
      - "8080:8000"
